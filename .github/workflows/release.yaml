name: Release

on:
  push:
    tags:
      - "microdnf-prebuilt-v*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. microdnf-prebuilt-vc6a9aa9.bcr.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT || 'manuelfrancisconaranjo.buildbuddy.io' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      - name: Prepare Upstream SHA & Pin microdnf
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          .github/workflows/release_prep.sh "${TAG}"

      - name: Build All Release Targets
        run: bazel build //:microdnf_all //:rpm2archive_all //:dnf_lock_all //:rpm2files_all //:dnf5_all --config=ci --remote_download_outputs=toplevel

      - name: Package Release Assets & Generate Integrities
        id: pkg
        run: |
          TAG="${{ steps.prep.outputs.tag_name }}"
          FULL_SHA="${{ steps.prep.outputs.upstream_full_sha }}"
          SHORT_SHA="${{ steps.prep.outputs.upstream_short_sha }}"
          BUILD_ID="${{ steps.prep.outputs.build_id }}"
          .github/workflows/package_release.sh "${TAG}" "${FULL_SHA}" "${SHORT_SHA}" "${BUILD_ID}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: microdnf-prebuilt ${{ steps.prep.outputs.tag_name }}
          body_path: release_notes.md
          files: release_assets/*
          draft: false
          prerelease: false
