name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT || 'manuelfrancisconaranjo.buildbuddy.io' }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    environment: pr-secrets # Pauses here until a maintainer approves in the UI
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          output-base: ""

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      - name: Build all targets
        run: bazel build //... //:microdnf_all //:rpm2archive_all //:dnf_lock_all //:rpm2files_all --config=ci

      - name: Test
        run: bazel test //... --config=ci
