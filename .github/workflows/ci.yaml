name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT || 'manuelfrancisconaranjo.buildbuddy.io' }}

jobs:
  # Post-merge pushes to main, tags, and manual workflow dispatches: trusted runs with NO approvals
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          output-base: ""

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      - name: Build all targets
        run: bazel build //... //:microdnf_all //:rpm2archive_all //:dnf_lock_all //:rpm2files_all --config=ci

      - name: Test
        run: bazel test //... --config=ci

  # Pull requests: gated behind pr-secrets environment approval. Fork PRs get no secrets
  # (setup_buildbuddy.sh then falls back to the local Docker sandbox).
  integration-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: pr-secrets # Pauses here until a maintainer approves in the UI
    permissions:
      contents: read
    steps:
      - name: Checkout PR code in merged state (the default ref of pull_request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          output-base: ""

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      - name: Build all targets
        run: bazel build //... //:microdnf_all //:rpm2archive_all //:dnf_lock_all //:rpm2files_all --config=ci

      - name: Test
        run: bazel test //... --config=ci
